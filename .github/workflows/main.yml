name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360  # Ajustado para o limite máximo suportado pelos runners padrão do GitHub (6 horas)

    steps:
      - name: Downloading & Installing Essentials
        run: |
          $installerPath = "$env:TEMP\Downloads.bat"
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile $installerPath
          cmd /c $installerPath

      - name: Log In To AnyDesk
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
          } else {
            Write-Host "Arquivo start.bat não encontrado. Verifique a configuração."
          }

      - name: Monitor and Restart AnyDesk if Needed
        run: |
          while ($true) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "AnyDesk não está rodando, reiniciando..."
              cmd /c start.bat
            }
            Start-Sleep -Seconds 300
          }

      - name: Time Counter (Long Running Task)
        run: |
          Start-Sleep -Seconds 18000  # Mantém a execução controlada dentro do limite do job

      - name: Clean Up Temporary Files
        if: success()
        run: |
          if (Test-Path "$env:TEMP\Downloads.bat") {
            Remove-Item "$env:TEMP\Downloads.bat" -Force
          }
          if (Test-Path "Downloads.bat") {
            Remove-Item "Downloads.bat" -Force
          }
          Write-Host "Limpeza completa."

